<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soramoyo 雲モデル検証</title>
  <style>
    html, body { margin: 0; height: 100%; background: #141416; overflow: hidden; color: #d8dde5; font: 13px system-ui, sans-serif; }
    canvas#view { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; left: 10px; top: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; background: rgba(0,0,0,.55);
           padding: 8px 10px; border-radius: 4px; white-space: pre; pointer-events: none; max-width: 60vw; }
    #legend { position: fixed; left: 10px; bottom: 10px; font: 12px ui-monospace, Consolas, monospace; background: rgba(0,0,0,.55);
              padding: 6px 10px; border-radius: 4px; }
    #bar { width: 260px; height: 10px; margin-top: 4px; }
    #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #111; padding: 2em; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="legend"><span id="legendText"></span><canvas id="bar" width="260" height="10"></canvas></div>
  <div id="fatal"></div>
  <script type="module" src="/src/simviewer/main.ts"></script>
</body>
</html>
