<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soramoyo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas#sky { display: block; width: 100vw; height: 100vh; cursor: grab; }
    canvas#sky:active { cursor: grabbing; }
    #hud { position: fixed; left: 10px; bottom: 10px; color: #cfd8e3; font: 12px/1.45 ui-monospace, Consolas, monospace;
           background: rgba(0,0,0,.35); padding: 6px 9px; border-radius: 4px; pointer-events: none; white-space: pre; }
    #labels .lbl { position: fixed; color: rgba(255,255,255,.75); font: 600 13px system-ui, sans-serif;
                   transform: translate(-50%, -120%); pointer-events: none; text-shadow: 0 0 3px #000; }
    #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #eee;
             font: 15px/1.6 system-ui, sans-serif; background: #111; padding: 2em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div id="labels"></div>
  <div id="hud"></div>
  <div id="fatal"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
